<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>runboard</title>
<link rel="icon" href="/icon.svg">
<style>
:root {
  --bg: #f4f4f1; --side: #ecece8; --card: #ffffff; --ink: #1b1b19; --ink2: #3c3c38; --muted: #6e6e68; --line: #e2e2dc; --hover: #f0f0ec;
  --accent: #2c6b5a; --accent-ink: #ffffff; --accent-soft: #e0eee9;
  --run: #2558a8; --run-soft: #e2eaf8; --warn: #95590a; --warn-soft: #faefd9; --bad: #a3322a; --bad-soft: #f8e2df;
  --s1: #2c6b5a; --s2: #2558a8; --s3: #b0562b; --s4: #7a4fa3; --s5: #8a8a2a;
  --mono: ui-monospace, "Cascadia Mono", Consolas, monospace; --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121211; --side: #171716; --card: #1b1b1a; --ink: #ededea; --ink2: #cfcfca; --muted: #93938c; --line: #2a2a28; --hover: #222220;
    --accent: #6cc3a6; --accent-ink: #0f1a16; --accent-soft: #1b322c;
    --run: #82abef; --run-soft: #1b2840; --warn: #e3a74a; --warn-soft: #36290f; --bad: #ef7f74; --bad-soft: #3a1d1a;
    --s1: #6cc3a6; --s2: #82abef; --s3: #e9926a; --s4: #b99ae0; --s5: #cfcf6a;
  }
}
* { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--line); border-radius: 10px; border: 3px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background: var(--muted); border: 3px solid transparent; background-clip: padding-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
a { color: var(--accent); }

.app { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; transition: grid-template-columns .2s; }
.side { position: sticky; top: 0; height: 100vh; background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 16px 12px; gap: 4px; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 2px 6px 14px; }
.brand img { width: 28px; height: 28px; border-radius: 7px; cursor: pointer; }
.brand b { font-size: 15px; }
.brand span { display: block; font-size: 11px; color: var(--muted); }
.collapse { margin-left: auto; border: 0; background: none; color: var(--muted); cursor: pointer; width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; flex: none; }
.collapse:hover { background: var(--hover); color: var(--ink); }
.collapse svg, .nav svg { stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.collapse svg { width: 16px; height: 16px; transition: transform .2s; }
.proj { display: flex; align-items: center; gap: 10px; padding: 8px; margin: 2px 0 8px; border-radius: 9px; background: var(--card); border: 1px solid var(--line); min-width: 0; }
.proj .t { min-width: 0; }
.proj b { display: block; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.proj small { color: var(--muted); font-size: 11px; cursor: pointer; }
.proj small:hover { color: var(--ink); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav .sec { font-size: 11px; font-weight: 650; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; padding: 10px 10px 4px; }
.nav button { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: none; padding: 8px 10px; border-radius: 8px; color: var(--ink2); cursor: pointer; text-align: left; font-weight: 500; }
.nav button:hover { background: var(--hover); }
.nav button.on { background: var(--card); color: var(--ink); box-shadow: 0 0 0 1px var(--line); font-weight: 600; }
.nav svg { width: 18px; height: 18px; flex: none; }
.nav .badge { margin-left: auto; font-size: 11px; background: var(--run-soft); color: var(--run); border-radius: 99px; padding: 0 7px; font-weight: 600; }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; padding: 12px 6px 0; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.side-foot a { text-decoration: none; font-weight: 600; }
.lang { display: flex; gap: 4px; }
.lang button { border: 1px solid var(--line); background: none; border-radius: 6px; padding: 1px 8px; font-size: 12px; cursor: pointer; color: var(--muted); }
.lang button.on { background: var(--card); color: var(--ink); font-weight: 600; }
.app.mini-side { grid-template-columns: 64px 1fr; }
.app.mini-side .brand div, .app.mini-side .nav button span, .app.mini-side .nav .badge, .app.mini-side .nav .sec,
.app.mini-side .side-foot, .app.mini-side .proj .t { display: none; }
.app.mini-side .brand { flex-direction: column; padding: 2px 0 12px; gap: 8px; }
.app.mini-side .collapse { margin: 0; }
.app.mini-side .collapse svg { transform: rotate(180deg); }
.app.mini-side .nav button { justify-content: center; padding: 10px 0; }
.app.mini-side .proj { justify-content: center; padding: 6px; }

.main { min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 16px; padding: 10px 28px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.top h1 { font-size: 18px; margin: 0; font-weight: 650; }
.top .crumb { color: var(--muted); font-size: 13px; }
.top .crumb a { color: var(--muted); text-decoration: none; }
.top .crumb a:hover { color: var(--ink); }
.top .right { margin-left: auto; display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--muted); }
.top .right .upd.off { color: var(--bad); }
.pairing { display: flex; gap: 22px; align-items: center; flex-wrap: wrap; margin-top: 14px; }
.pairing .qr svg { width: 220px; height: 220px; border-radius: 8px; display: block; }
dialog.form-dlg { border: 1px solid var(--line); border-radius: 14px; padding: 0; width: min(640px, calc(100vw - 32px)); max-height: calc(100vh - 48px); background: var(--card); color: var(--ink); }
dialog.form-dlg::backdrop { background: rgba(0, 0, 0, .45); }
dialog.form-dlg .dh2 { display: flex; align-items: center; gap: 10px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
dialog.form-dlg .dh2 h2 { font-size: 16px; margin: 0; }
dialog.form-dlg .db { padding: 16px 20px; overflow: auto; max-height: calc(100vh - 190px); }
dialog.form-dlg .df { display: flex; gap: 8px; justify-content: flex-end; padding: 12px 20px; border-top: 1px solid var(--line); }
.diff { font: 12px/1.6 var(--mono); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 0; overflow: auto; margin: 6px 0 0; }
.diff div { padding: 0 12px; white-space: pre; }
.diff .add { background: var(--accent-soft); }
.diff .del { background: var(--bad-soft); }
.diff .hunk { color: var(--muted); }
td .own { font-weight: 650; color: var(--ink); }
td .inh { color: var(--muted); }
.acts { white-space: nowrap; text-align: right; }
.acts .btn { padding: 4px 10px; font-size: 12px; }
.setrow td:first-child { width: 34%; }
.setrow input, .setrow select { width: 100%; }
.setrow.rm td { opacity: .45; text-decoration: line-through; }
.setrow.rm td:last-child { opacity: 1; text-decoration: none; }
textarea.rawed { width: 100%; min-height: 360px; font: 12.5px/1.55 var(--mono); background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 12px; resize: vertical; tab-size: 2; }
.rawstate { font-size: 12px; margin-left: 4px; }
.rawstate.bad { color: var(--bad); cursor: pointer; text-decoration: underline dotted; }
.rawstate.ok { color: var(--accent); }
.sweepf { display: grid; grid-template-columns: 120px 1fr; gap: 10px 14px; align-items: start; margin-top: 12px; }
.sweepf > b { font-size: 13px; padding-top: 6px; }
.sweepf .opts { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.sweepf input[type=text] { width: 100%; }
.qrow { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 13px; }
.qrow:first-child { border-top: 0; }
.qrow .n { width: 22px; color: var(--muted); text-align: right; }
.qrow .w { color: var(--muted); font-size: 12px; }
.qrow .w.bad { color: var(--bad); }
.qrow .sp { margin-left: auto; display: flex; gap: 6px; }
.qrow .btn { padding: 3px 9px; font-size: 12px; }
.qrow .click { cursor: pointer; }
dialog.askdlg { width: min(460px, calc(100vw - 32px)); }
.askmsg { white-space: pre-wrap; margin: 0; font-size: 14px; line-height: 1.55; max-height: 50vh; overflow: auto; }
.btn.danger.solid { background: var(--bad); color: #fff; border-color: var(--bad); }
.toast.bad { background: var(--bad); color: #fff; }
.paircode { font: 600 34px/1.2 ui-monospace, Consolas, monospace; letter-spacing: 4px; margin: 6px 0; }
@media (max-width: 760px) { .top .right .upd.off { display: inline; } }
.live { display: inline-flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 99px; padding: 4px 12px 4px 10px; font-size: 13px; color: var(--ink2); cursor: pointer; white-space: nowrap; }
.content { padding: 20px 28px 48px; width: 100%; max-width: 2400px; }

.avatar { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; font-weight: 700; font-size: 13px; color: #fff; flex: none; overflow: hidden; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; display: inline-block; }
.dot.RUNNING, .dot.QUEUED, .dot.STARTING, .dot.CANCELLING { background: var(--run); box-shadow: 0 0 0 3px var(--run-soft); animation: pulse 2s infinite; }
.dot.COMPLETE { background: var(--accent); }
.dot.ERROR, .dot.CANCELLED { background: var(--bad); }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px transparent; } }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 99px; background: var(--hover); color: var(--muted); white-space: nowrap; }
.chip.RUNNING, .chip.QUEUED, .chip.STARTING, .chip.CANCELLING, .chip.running { background: var(--run-soft); color: var(--run); }
.chip.COMPLETE, .chip.ok, .chip.ready { background: var(--accent-soft); color: var(--accent); }
.chip.ERROR, .chip.error, .chip.CANCELLED { background: var(--bad-soft); color: var(--bad); }
.chip.lock { background: var(--warn-soft); color: var(--warn); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
.card + .card { margin-top: 16px; }
.ch { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.ch h2 { font-size: 15px; margin: 0; font-weight: 650; }
.ch .sp { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.cb { padding: 16px 18px; }
.cb.flush { padding: 0; }
.desc { color: var(--muted); font-size: 13px; margin: 0 0 12px; max-width: 900px; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--card); padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; text-decoration: none; color: var(--ink2); white-space: nowrap; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.msg { border-radius: 8px; padding: 10px 12px; font-size: 13px; margin: 0 0 12px; }
.msg.bad { background: var(--bad-soft); color: var(--bad); }
.msg.warn { background: var(--warn-soft); color: var(--warn); }
.msg.ok { background: var(--accent-soft); color: var(--accent); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px; margin-bottom: 16px; }
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; min-width: 0; }
.kpi .l { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .4px; }
.kpi .v { font-size: 24px; font-weight: 650; margin-top: 4px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi .v small { color: var(--muted); font-size: 15px; font-weight: 600; }
.kpi .s { font-size: 12px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar { height: 6px; background: var(--hover); border-radius: 3px; overflow: hidden; margin-top: 8px; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width 1s linear; }
.bar.big { height: 10px; border-radius: 5px; }
.est { color: var(--muted); font-size: 11px; font-weight: 500; }
.cols { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 16px; align-items: stretch; }
.cols > .card + .card { margin-top: 0; }
.cols > .card { display: flex; flex-direction: column; }
.cols > .card > .cb { flex: 1; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: 11px; color: var(--muted); font-weight: 650; text-transform: uppercase; letter-spacing: .4px; background: color-mix(in srgb, var(--hover) 50%, transparent); }
tr:last-child td { border-bottom: 0; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
tr.click, [data-go], [data-href] { cursor: pointer; }
[tabindex="0"]:focus-visible, .btn:focus-visible, .nav button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
tr.click:hover td { background: var(--hover); }
.tw { overflow-x: auto; }
.muted { color: var(--muted); }
.mono { font-family: var(--mono); font-size: 12px; }

/* projects */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 16px; }
.grid + .grid { margin-top: 16px; }
.home-kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.k6 { grid-template-columns: repeat(6, minmax(0, 1fr)); }
@media (max-width: 1300px) { .k6 { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 600px) { .k6 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 1100px) { .home-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .home-kpis { grid-template-columns: 1fr; } }
.pcard { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; cursor: pointer; display: flex; flex-direction: column; gap: 12px; transition: border-color .15s, transform .15s; min-width: 0; }
.pcard:hover { border-color: var(--accent); transform: translateY(-1px); }
.pcard .hd { display: flex; gap: 12px; align-items: center; min-width: 0; }
.pcard .hd .avatar { width: 44px; height: 44px; border-radius: 11px; font-size: 16px; }
.pcard h3 { margin: 0; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pcard .path { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pcard p { margin: 0; color: var(--ink2); font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.pcard .row { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.pcard .act { background: var(--run-soft); color: var(--run); border-radius: 8px; padding: 8px 10px; font-size: 12px; font-weight: 600; }
.pcard .act .bar { background: color-mix(in srgb, var(--run) 18%, transparent); }
.pcard .act .bar i { background: var(--run); }
.addp { border-style: dashed; align-items: center; justify-content: center; text-align: center; gap: 8px; color: var(--muted); min-height: 220px; }
.addp .plus { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font-size: 26px; font-weight: 300; }
.addp b { color: var(--ink); font-size: 15px; }

/* roadmap */
.phase { display: grid; grid-template-columns: 160px 1fr; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: center; }
.phase:last-child { border-bottom: 0; }
.phase .pn b { display: block; font-size: 13px; }
.phase .pn span { font-size: 12px; color: var(--muted); }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 7px; padding: 4px 9px; font-size: 12px; font-weight: 600; cursor: pointer; background: var(--card); color: var(--ink2); }
.pill:hover { background: var(--hover); }
.pill small { color: var(--muted); font-weight: 500; }

/* runs */
.split { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 16px; align-items: start; }
.rl { position: sticky; top: 76px; max-height: calc(100vh - 100px); overflow: auto; }
.rl .grp { font-size: 11px; font-weight: 650; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; padding: 12px 14px 4px; }
.ri { display: grid; grid-template-columns: auto 1fr auto; gap: 2px 10px; align-items: center; padding: 8px 14px; cursor: pointer; border-left: 3px solid transparent; }
.ri:hover { background: var(--hover); }
.ri.sel { background: var(--accent-soft); border-left-color: var(--accent); }
.ri b { font-size: 13px; }
.ri .m { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; grid-column: 2 / 4; }
.ri .val { font-size: 12px; font-variant-numeric: tabular-nums; color: var(--ink2); font-weight: 600; }
.dh { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.dh h2 { margin: 0; font-size: 20px; }
.dh .sp { margin-left: auto; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.meta { color: var(--muted); font-size: 13px; margin-top: 4px; }
.meta b { color: var(--ink2); font-weight: 600; }
.prog { margin: 16px 0 4px; }
.prog .lbl { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.stage { font-size: 13px; color: var(--ink2); margin-top: 8px; }
.stage::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--run); margin-right: 8px; vertical-align: middle; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); padding: 0 18px; overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 11px 12px; font-weight: 600; font-size: 13px; color: var(--muted); border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; }
.tabs button.on { color: var(--ink); border-bottom-color: var(--accent); }
.charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 14px; }
.chart { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px 6px; }
.chart .t { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); align-items: center; }
.chart .t b { color: var(--ink); font-size: 13px; margin-right: auto; }
.chart .t i { display: inline-block; width: 12px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
svg.c { width: 100%; height: 180px; display: block; }
.chart .cw { position: relative; }
.chart .yl { position: absolute; left: 0; transform: translateY(-50%); text-align: right; font-size: 10px; line-height: 1; color: var(--muted); font-variant-numeric: tabular-nums; }
.chart .xl { position: absolute; bottom: 0; font-size: 10px; line-height: 1; color: var(--muted); }
.chart .cw { cursor: zoom-in; }
.chart .t .ct { cursor: pointer; }
.chart .t .ct:hover { text-decoration: underline; text-underline-offset: 3px; }
.chart .t .lg { cursor: pointer; user-select: none; border-radius: 4px; padding: 1px 3px; }
.chart .t .lg:hover { background: var(--hover); }
.chart .t .lg.off { opacity: .4; text-decoration: line-through; }
.chart .t .cx { border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 6px; width: 24px; height: 22px; padding: 0; cursor: pointer; font-size: 13px; line-height: 1; opacity: .55; }
.chart:hover .t .cx, .chart .t .cx:focus-visible { opacity: 1; color: var(--ink); }
.chart.flat { border: 0; padding: 0; }
#bigplot, .bigov { touch-action: none; user-select: none; -webkit-user-select: none; }
#bigplot .cw { cursor: crosshair; }
#bigplot.zoomed .cw { cursor: grab; }
#bigplot.panning .cw { cursor: grabbing; }
.zbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-bottom: 8px; font-size: 13px; }
.zbtns { display: inline-flex; gap: 4px; }
.zbtns .btn { min-width: 36px; justify-content: center; padding: 4px 10px; font-size: 15px; }
.zbtns .btn:disabled { opacity: .4; cursor: default; }
.bigov { position: relative; height: 48px; margin-top: 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); cursor: pointer; overflow: hidden; }
.bigov svg { width: 100%; height: 100%; display: block; }
.bigov .win { position: absolute; top: 0; bottom: 0; border: 2px solid var(--accent); border-radius: 5px; pointer-events: none; box-shadow: 0 0 0 100vw color-mix(in srgb, var(--bg) 62%, transparent); }  /* the line shows through; outside is dimmed */
.bigov .win.all { border-style: dashed; opacity: .6; box-shadow: none; }
.bigov .win i { position: absolute; top: 50%; width: 6px; height: 22px; margin-top: -11px; border-radius: 3px; background: var(--accent); }
.bigov .win i:first-child { left: 2px; }
.bigov .win i:last-child { right: 2px; }
.bigov .win.all i { display: none; }
@media (pointer: coarse) {
  .zbtns .btn { min-width: 48px; height: 42px; font-size: 19px; }
  .bigov { height: 64px; }
  .bigov .win i { width: 10px; height: 34px; margin-top: -17px; }
}
@media (max-width: 760px) { dialog.big-chart { width: 100vw; max-width: 100vw; margin: 0; border-radius: 0; } }
.ctip { position: fixed; z-index: 60; pointer-events: none; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font-size: 12px; box-shadow: 0 6px 20px rgba(0,0,0,.25); min-width: 150px; }
.ctip b { display: block; margin-bottom: 3px; font-size: 12px; }
.ctip div { display: flex; align-items: center; gap: 6px; line-height: 1.6; color: var(--ink2); }
.ctip div span { margin-left: auto; padding-left: 12px; font-variant-numeric: tabular-nums; color: var(--ink); font-weight: 600; white-space: nowrap; }
.ctip em, .bigstats .up, .bigstats .down { font-style: normal; font-weight: 500; font-size: 11px; }
.ctip em.up, .bigstats .up { color: var(--accent); }
.ctip em.down, .bigstats .down { color: var(--bad); }
.ctip i, .big-chart .sw { display: inline-block; width: 10px; height: 3px; border-radius: 2px; vertical-align: middle; }
.cguide { position: fixed; z-index: 59; width: 1px; background: var(--muted); opacity: .55; pointer-events: none; }
.cpt { position: fixed; z-index: 61; width: 9px; height: 9px; border-radius: 50%; border: 2px solid; background: var(--card); transform: translate(-50%, -50%); pointer-events: none; }
.csel { position: fixed; z-index: 70; background: var(--accent-soft); border: 1px solid var(--accent); opacity: .5; pointer-events: none; }
.chart .bm { position: absolute; width: 11px; height: 11px; border: 2px solid; border-radius: 50%; background: var(--card); transform: translate(-50%, -50%); pointer-events: none; }
.chart .bml { position: absolute; transform: translate(-50%, -150%); font-size: 11px; font-weight: 600; white-space: nowrap; background: var(--card); padding: 0 4px; border-radius: 4px; pointer-events: none; }
dialog.big-chart { width: min(1320px, calc(100vw - 32px)); }
dialog.big-chart .dh2 { flex-wrap: wrap; }
dialog.big-chart .dh2 select { font-weight: 600; font-size: 15px; max-width: 360px; }
dialog.big-chart .db { max-height: calc(100vh - 120px); }
.bigbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; margin-bottom: 10px; font-size: 13px; }
.bigbar input[type=range] { width: 140px; vertical-align: middle; }
.bigstats td, .bigstats th { font-variant-numeric: tabular-nums; }
.chart .dot { position: absolute; width: 7px; height: 7px; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; }
.log { font: 12px/1.55 var(--mono); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px; height: 420px; overflow: auto; white-space: pre-wrap; word-break: break-word; color: var(--ink2); }
.log.short { height: 240px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
.toolbar .sp { margin-left: auto; }
label.tog { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); cursor: pointer; }
.form { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; align-items: end; }
.form label { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--muted); font-weight: 600; }
.form .wide { grid-column: span 2; }
input, select { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 7px 10px; font-size: 13px; min-width: 0; }
input:focus, select:focus, .btn:focus-visible, .nav button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
details summary { cursor: pointer; color: var(--muted); font-size: 13px; font-weight: 600; }
pre.raw { font: 12px/1.55 var(--mono); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px; overflow: auto; max-height: 460px; margin: 10px 0 0; white-space: pre-wrap; }
.empty { padding: 36px 18px; text-align: center; color: var(--muted); }
.toast { position: fixed; right: 20px; bottom: 20px; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 13px; box-shadow: 0 6px 24px #0005; z-index: 20; }
.hide { display: none !important; }

/* full-page run view: compact so the charts are on the first screen at 1080p */
#runpage .card > .cb { padding: 14px 18px; }
#runpage .dh h2 { font-size: 18px; }
#runpage .meta { margin-top: 2px; }
#runpage .prog { margin: 10px 0 2px; }
#runpage .stage { margin-top: 6px; }
#runpage .kpis { margin-top: 12px !important; margin-bottom: 12px; gap: 12px; }
#runpage .kpi { padding: 10px 14px; }
#runpage .kpi .v { font-size: 20px; margin-top: 2px; }
#runpage .card + .card, #runpage .kpis + .card { margin-top: 0 !important; }
#runpage .tabs button { padding: 9px 12px; }
#runpage .charts { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
#runpage svg.c { height: clamp(150px, calc(100vh - 560px), 260px) !important; }
.btn.back { padding: 4px 10px; font-size: 15px; }

/* wizard & connections */
.wizard { max-width: 1100px; margin: 0 auto; }
.stepper { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
.stp { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--muted); font-weight: 600; font-size: 13px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stp span { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--hover); font-size: 12px; flex: none; }
.stp.on { border-color: var(--accent); color: var(--ink); }
.stp.on span { background: var(--accent); color: var(--accent-ink); }
.stp.done span { background: var(--accent-soft); color: var(--accent); }
.choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.choices.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.choice { position: relative; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; padding: 16px; border: 1px solid var(--line); border-radius: 12px; cursor: pointer; background: var(--card); color: var(--muted); font-size: 13px; }
.choice b { color: var(--ink); font-size: 15px; }
.choice:hover { border-color: var(--muted); }
.choice.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); background: color-mix(in srgb, var(--accent-soft) 45%, var(--card)); }
.choice.off { cursor: not-allowed; opacity: .6; }
.choice input[type=checkbox] { position: absolute; top: 14px; right: 14px; }
.pathrow, .tokenrow { display: flex; gap: 8px; margin: 12px 0; }
.pathrow input, .tokenrow input { flex: 1; }
.fl { max-height: 340px; overflow: auto; padding: 4px; }
.fi { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 7px; cursor: pointer; font-size: 13px; }
.fi:hover { background: var(--hover); }
.fi svg { width: 16px; height: 16px; stroke: var(--muted); fill: none; stroke-width: 1.8; flex: none; }
.fi .chip { margin-left: auto; }
.wnav { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line); }
.wh { font-size: 14px; margin: 18px 0 8px; }
.models { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.mg { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.mg b { width: 100%; font-size: 13px; }
.summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin: 16px 0; }
.summary > div { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-width: 0; }
.summary span { display: block; font-size: 12px; color: var(--muted); }
.summary b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.conn-h { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.steps { margin: 12px 0 0; padding-left: 20px; color: var(--ink2); font-size: 13px; line-height: 1.8; }
@media (max-width: 860px) { .summary, .models, .choices, .choices.three { grid-template-columns: 1fr 1fr; } }
@media (max-width: 560px) { .summary, .models, .choices, .choices.three { grid-template-columns: 1fr; } .stepper { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; } .stp { justify-content: center; padding: 8px 6px; } .stp:not(.on) { font-size: 0; } .stp span { font-size: 12px; } }

@media (max-width: 1180px) { .cols { grid-template-columns: 1fr; } }
@media (max-width: 1000px) {
  .app, .app.mini-side { grid-template-columns: 64px 1fr; }
  .brand div, .nav button span, .nav .badge, .nav .sec, .side-foot, .collapse, .proj .t { display: none; }
  .brand { justify-content: center; padding: 2px 0 14px; }
  .nav button { justify-content: center; padding: 10px 0; }
  .proj { justify-content: center; padding: 6px; }
  .split { grid-template-columns: 1fr; }
  .rl { position: static; max-height: 300px; }
}
@media (max-width: 700px) {
  .app, .app.mini-side { grid-template-columns: 1fr; }
  .side { position: fixed; top: auto; bottom: 0; left: 0; right: 0; height: auto; flex-direction: row; padding: 6px; z-index: 10; border-right: 0; border-top: 1px solid var(--line); overflow: visible; }
  .brand, .proj { display: none; }
  .nav { flex-direction: row; width: 100%; justify-content: space-around; }
  .nav button { flex-direction: column; gap: 2px; font-size: 10px; padding: 6px 4px; }
  .nav button span { display: block; }
  .top { padding: 12px 16px; }
  .top .right .upd { display: none; }
  .content { padding: 16px 16px 90px; }
  .form .wide { grid-column: auto; }
  .phase { grid-template-columns: 1fr; }
}

</head>

function renderRunsTab() {
  if (!route.run || !run(route.run)) { const def = P.runs.find(r => ACTIVE.includes(r.status)) || P.runs.find(r => r.status) || P.runs[0]; if (def) { location.replace(runHref(def.id)); return; } }
  if (!$("#runlist")) $("#content").innerHTML = `<div class="split"><div class="card rl" id="runlist"></div><div id="detail"></div></div>`;
  const groups = [...(P.phases.length ? P.phases.map(ph => [[ph.id, tx(ph.title)].filter(Boolean).join(" · "), ph.runs]) : [[t("runs"), P.runs.filter(r => !r.extra).map(r => r.id)]]),
                  [t("extra"), P.runs.filter(r => r.extra).map(r => r.id)]];
  const listed = new Set(groups.flatMap(g => g[1]));
  const rest = P.runs.filter(r => !listed.has(r.id)).map(r => r.id); if (rest.length) groups.push(["—", rest]);
  morph($("#runlist"), groups.filter(g => g[1].length).map(([title, ids]) => `<div class="grp">${esc(title)}</div>` + ids.map(id => {
    const r = run(id); if (!r) return ""; const p = r.progress || {}, on = ACTIVE.includes(r.status);
    const val = valOf(r) != null ? fmt(valOf(r), 1) : "";
    const m = r.ready ? Object.values(r.fields).map(short).join(" · ") : `${t("waits")} ${r.missing.join(", ")}`;
    return `<div class="ri ${id === route.run ? "sel" : ""}" tabindex="0" role="link" data-go="${runHref(id)}"><span class="dot ${r.status || ""}"></span><b>${esc(id)}</b><span class="val">${on ? `e${p.epoch || 0}/${p.epochs || r.epochs || "?"}` : val}</span><span class="m">${esc(m)}</span></div>`;
  }).join("")).join(""));
  loadDetail();
}
function renderRunPage() {
  if (!run(route.run)) { go(`#/p/${P.key}/runs`); return; }
  if (!$("#runpage")) $("#content").innerHTML = `<div id="runpage"><div id="detail"></div></div>`;
  loadDetail();
}
// The open run's details arrive as `run` events; a fetch is only needed for the first paint and for compared runs.
async function loadDetail() {
  if (route.view !== "project" || !["runs", "run"].includes(route.tab) || !route.run) return;
  const id = route.run;
  if (detail?.id !== id) { const d = await api(`/api/p/${P.key}/run/${encodeURIComponent(id)}`).catch(() => null); if (d && route.run === id && detail?.id !== id) detail = d; }
  for (const c of compare) if (!compCache[c] || (ACTIVE.includes(run(c)?.status) && Date.now() - compCache[c]._t > 30000)) {
    const d = await api(`/api/p/${P.key}/run/${encodeURIComponent(c)}`).catch(() => null); if (d) compCache[c] = {...d, _t: Date.now()};
  }
  renderDetail();
}

async function act(e, path, json, then) {

// A log follows new lines only while the reader is at its end; otherwise it stays where they scrolled.
const atEnd = el => el.scrollTop + el.clientHeight >= el.scrollHeight - 30;
// Log lines arrive as `log` events (the whole log once, then only new lines) and are appended, never redrawn.
let LOG = {run: null, all: null, lines: null};
function logEvent(j) {
  if (j.run !== route.run) return;
  const fresh = j.reset || LOG.run !== j.run || LOG.all !== allLog || !LOG.lines;
  LOG = {run: j.run, all: allLog, lines: fresh ? j.lines : LOG.lines.concat(j.lines).slice(-3000)};
  paintLog(fresh ? null : j.lines, fresh);
}
function paintLog(added, force) {
  const el = $("#log"); if (!el) return;
  const shown = `${LOG.run}|${LOG.all}`;
  if (LOG.run !== route.run || LOG.all !== allLog || !LOG.lines) { el.textContent = "…"; el.dataset.shown = ""; return; }
  const end = el.dataset.shown !== shown || atEnd(el);
  if (added && el.dataset.shown === shown && +el.dataset.n > 0 && el.childNodes.length < 400) { if (added.length) el.append("\n" + added.join("\n")); }
  else if (force || added || el.dataset.shown !== shown || +el.dataset.n !== LOG.lines.length) el.textContent = LOG.lines.length ? LOG.lines.join("\n") : t("no_log");
  el.dataset.shown = shown; el.dataset.n = LOG.lines.length;
  if (end) el.scrollTop = el.scrollHeight;
}

/* ================= jobs ================= */
// Job output arrives as `job` events (everything once, then only new lines); each box shows one job at a time and a
// running job takes the box over.
const JOBS = {};
function jobEvent(j) {
  const k = `${j.project}:${j.kind}`, prev = JOBS[k];
  JOBS[k] = {...j, lines: j.reset || !prev ? j.lines : prev.lines.concat(j.lines).slice(-2000)};
  paintJob(j.project, j.kind, j.reset || !prev ? null : j.lines);
}
function jobBox(pkey, kind) {
  if (route.view === "system") return $(`#jobbox-${pkey}`);
  if (route.view === "project" && route.tab === "data" && pkey === P?.key && (kind === "upload" || kind === dataBuild)) return $("#jobbox");
}
function paintJob(pkey, kind, added) {
  const el = jobBox(pkey, kind), J = JOBS[`${pkey}:${kind}`]; if (!el || !J) return;
  const cur = el.dataset.job;
  if (cur && cur !== kind && JOBS[`${pkey}:${cur}`]?.status === "running" && J.status !== "running") return;
  if (cur !== kind) { el.dataset.job = kind; el.innerHTML = `<div class="toolbar jh"></div><div class="log short"></div>`; added = null; }
  morph(el.querySelector(".jh"), `<b>${esc(tx(J.title))}</b>${chip(J.status === "running" ? "RUNNING" : J.status === "ok" ? "COMPLETE" : "ERROR", t(J.status === "running" ? "RUNNING" : J.status === "ok" ? "COMPLETE" : "ERROR"))}<span class="muted" style="font-size:12px">${J.seconds} s</span>`);
  const lg = el.querySelector(".log"), end = !lg.childNodes.length || atEnd(lg);
  if (added && lg.childNodes.length && lg.childNodes.length < 400) { if (added.length) lg.append("\n" + added.join("\n")); }
  else lg.textContent = J.lines.join("\n");
  if (end) lg.scrollTop = lg.scrollHeight;
}
function showJobs(pkey) {  // a freshly drawn box: show what is already known (a running job first)
  const mine = Object.values(JOBS).filter(j => j.project === pkey && jobBox(pkey, j.kind));
  const pick = mine.find(j => j.status === "running") || mine.at(-1);
  if (pick) paintJob(pkey, pick.kind);
}

// Pairing: a one-time QR code / 6-digit code from the server; the list refreshes once the tablet has used it.
let pairTimer = null;
async function startPairing() {
  clearInterval(pairTimer);
  let p; try { p = await api("/api/devices/pair", {method: "POST"}); } catch (e) { return say(e.message); }
  const box = $("#pairbox"); if (!box) return;
  const before = (await api("/api/devices").catch(() => ({devices: []}))).devices.length, end = Date.now() + p.seconds * 1000;
  box.innerHTML = `<div class="pairing"><div class="qr">${p.qr}</div><div><p class="desc">${t("pair_scan")}</p><p class="desc">${t("pair_or")}<br><span class="mono">${esc(p.base)}</span></p>
    <div class="paircode">${esc(p.code.slice(0, 3))} ${esc(p.code.slice(3))}</div><p class="muted" id="pairleft" style="font-size:12px"></p></div></div>`;
  const step = async () => {
    const left = Math.round((end - Date.now()) / 1000), el = $("#pairleft");
    if (!el) return clearInterval(pairTimer);
    if (left <= 0) { clearInterval(pairTimer); box.innerHTML = `<p class="muted">${t("pair_expired")}</p>`; return; }
    el.textContent = `${t("pair_left")} ${left} s`;
    if (left % 2) return;
    const d = await api("/api/devices").catch(() => null);
    if (d && d.devices.length > before) { clearInterval(pairTimer); box.innerHTML = ""; toast(t("paired_ok", {name: d.devices.at(-1).name})); renderSystem(); }
  };
  step(); pairTimer = setInterval(step, 1000);
}

/* ================= connections (credentials) ================= */
function kaggleBox(k, onDone) {
  // Kaggle connection state; when not connected, a 3-step guide with a single token field.
  const ok = k?.ok;
  if (!ME?.local) return {html: `<div class="conn"><div class="conn-h"><b>Kaggle</b>${ok ? chip("COMPLETE", t("connected")) : chip("", t("not_connected"))}<span class="muted" style="font-size:12px">${ok ? esc(k.user || "") : ""}</span></div><p class="desc" style="margin:8px 0 0">${t("local_only")}</p></div>`, bind: () => {}};
  const html = `<div class="conn">
    <div class="conn-h"><b>Kaggle</b>${ok ? chip("COMPLETE", t("connected")) : chip("", t("not_connected"))}<span class="muted" style="font-size:12px">${ok ? `${esc(k.user)}${k.quota ? ` · ${t("gpu_quota")} ${k.quota.used_h} / ${k.quota.total_h} h` : ""}` : ""}</span></div>
    ${ok ? `<p class="desc" style="margin:8px 0 0">${t("token_where")} <span class="mono">${esc(k.file)}</span>${k.source === "env" ? " (KAGGLE_API_TOKEN)" : ""}</p>
      <div class="toolbar" style="margin:10px 0 0"><button class="btn" data-k="replace">${t("replace_token")}</button><button class="btn danger" data-k="forget">${t("disconnect")}</button></div>
      <div class="kform hide">` : `<ol class="steps">
        <li>${t("k_step1")} <a href="https://www.kaggle.com/settings/api" target="_blank" rel="noopener">kaggle.com/settings/api ↗</a></li>
        <li>${t("k_step2")}</li><li>${t("k_step3")}</li></ol><div class="kform">`}
      <div class="tokenrow"><input type="password" class="ktok" autocomplete="off" spellcheck="false" placeholder="KGAT_…" aria-label="Kaggle API token"><button class="btn primary" data-k="save">${t("save_test")}</button></div>
      <p class="desc" style="margin:6px 0 0">${t("token_note")}</p>${k && !k.installed ? `<div class="msg warn" style="margin-top:8px">pip install kaggle</div>` : ""}</div></div>`;
  const bind = root => {
    const on = (k, f) => { const b = root.querySelector(`[data-k="${k}"]`); if (b) b.onclick = f; };
    on("replace", () => root.querySelector(".kform").classList.toggle("hide"));
    on("forget", async () => {
      if (!await ask(t("sure_disconnect"), true)) return;
      await api("/api/connections/kaggle", {method: "DELETE"}).catch(e => say(e.message)); onDone?.();
    });
    on("save", async e => {
      const inp = root.querySelector(".ktok"), b = e.target; if (!inp.value.trim()) return inp.focus();
      b.disabled = true; b.textContent = "…";
      try { await api("/api/connections/kaggle", {json: {token: inp.value.trim()}}); inp.value = ""; toast(t("kaggle_ok")); await loadProjects(); onDone?.(); }
      catch (err) { say(err.message); b.disabled = false; b.textContent = t("save_test"); }
    });
  };
  return {html, bind};
}

  const open = async dir => { try { W.fs = await api(`/api/fs?path=${encodeURIComponent(dir)}`); renderWizard(); } catch (e) { say(e.message); } };
  document.querySelectorAll("[data-dir]").forEach(el => el.onclick = () => open(el.dataset.dir));
  const on = (id, ev, f) => { const el = $(id); if (el) el["on" + ev] = f; };  // property handlers: re-wiring a patched page is harmless
  on("#wgo", "click", () => open($("#wpath").value));
  on("#wpath", "keydown", e => e.key === "Enter" && open(e.target.value));
  on("#wpick", "click", async () => {
    try { W.scan = await api("/api/wizard/scan", {json: {path: W.fs.path}}); W.path = W.scan.path; W.name = W.scan.name; W.kind = W.scan.suggest;
      W.yolo.data = ""; W.script.file = ""; W.step = 2; renderWizard(); } catch (e) { say(e.message); }
  });
  on("#wexisting", "click", async () => {
    const cmds = W.scan?.commands || [];
    if (cmds.length && !await ask(`${t("w_trust")}\n\n${cmds.join("\n")}`)) return;
    try { const j = await api("/api/projects", {json: {path: W.path}}); await loadProjects(); go(`#/p/${j.key}/overview`); } catch (e) { say(e.message); } });
  document.querySelectorAll("[data-kind]").forEach(el => el.onclick = () => { readStep2(); W.kind = el.dataset.kind; renderWizard(); });
  document.querySelectorAll(".ym, #yseeds, #ydata").forEach(el => el.onchange = () => { readStep2(); renderWizard(); });
  on("#sadd", "click", () => { readStep2(); W.script.runs.push({id: `run${W.script.runs.length + 1}`, args: ""}); renderWizard(); });
  document.querySelectorAll(".sdel").forEach(b => b.onclick = () => { readStep2(); W.script.runs.splice(+b.dataset.i, 1); renderWizard(); });
  document.querySelectorAll(".wb").forEach(cb => cb.onchange = () => {
    W.backends = [...document.querySelectorAll(".wb:checked")].map(x => x.value);
    if (!W.backends.includes(W.default_backend)) W.default_backend = W.backends[0] || "local"; renderWizard();
  });
  on("#wdef", "change", e => W.default_backend = e.target.value);
  on("#wback", "click", () => { if (W.step === 2) readStep2(); W.step--; W.error = null; renderWizard(); });
  on("#wnext", "click", async () => {
    if (W.step === 2) { readStep2(); if (W.kind === "yolo" && !W.yolo.models.length) return say(t("w_pick_model")); }
    if (W.step === 3) await previewWizard();
    W.step++; renderWizard();
  });
  [["#wname", "name"], ["#wdesc", "description"], ["#wcolor", "color"]].forEach(([id, k]) => on(id, "input", e => { W[k] = e.target.value; }));
  on("#wcreate", "click", () => createWizard(false));
}
async function previewWizard() {
  W.error = null;
  try {
    const j = await api("/api/wizard/preview", {json: wSpec()});
    const runsPart = (j.files["runboard_runs.yaml"] || "").split(/^runs:\s*$/m)[1] || "";
    W.preview = {files: j.files, nruns: runsPart.split("\n").filter(l => /^  [^\s#]/.test(l)).length};
  } catch (e) { W.preview = null; W.error = e.message; }
}
async function createWizard(overwrite) {
  try {
    const j = await api("/api/wizard/create", {json: {...wSpec(), overwrite}});
    toast(t("w_created")); await loadProjects(); Object.assign(W, {step: 1, preview: null, scan: null, name: "", error: null}); go(`#/p/${j.key}/overview`);
  } catch (e) {
    if (/Already exists/.test(e.message) && await ask(t("w_overwrite", {f: e.message.replace("Already exists: ", "")}), true)) return createWizard(true);
    W.error = e.message; renderWizard();
  }
}

/* ================= main loop ================= */
async function loadProjects() { PS = await api("/api/projects"); }
function notify() {
  for (const p of PS.projects) for (const r of (P && P.key === p.key ? P.runs : p.active)) {
    const k = p.key + ":" + r.id;
    if (prevStatus[k] && prevStatus[k] !== r.status && ["COMPLETE", "ERROR"].includes(r.status)) {
      const msg = t(r.status === "COMPLETE" ? "toast_done" : "toast_err", {run: `${p.name} · ${r.id}`});
      toast(msg); try { if (Notification.permission === "granted") new Notification("runboard", {body: msg}); } catch {}
    }
    prevStatus[k] = r.status;
  }
}
/* ================= live connection ================= */
// One EventSource per screen. The server sends what changed (projects, the open project, the open run) plus appended
// log and job lines; the page patches itself. The browser reconnects by itself after network drops.
let ES = null, esUrl = "";
function subscribe(force) {
  const q = new URLSearchParams();
  if (route.view === "project") {
    q.set("p", route.key);
    const rid = ["runs", "run"].includes(route.tab) ? route.run : route.tab === "overview" ? P?.runs.find(r => ACTIVE.includes(r.status))?.id : null;
    if (rid) q.set("run", rid);
    if (rid && rid === route.run && sub === "log") { q.set("log", "1"); if (allLog) q.set("all", "1"); }
    if (route.tab === "data") q.set("jobs", route.key);
  } else if (route.view === "system") q.set("jobs", "*");
  const url = "/api/events?" + q;
  if (!force && url === esUrl && ES && ES.readyState !== 2) return;
  ES?.close(); esUrl = url; ES = new EventSource(location.origin + url);
  const on = (name, f) => ES.addEventListener(name, e => { try { f(JSON.parse(e.data)); } catch (err) { console.error(name, err); } });
  on("projects", d => { PS = d; notify(); renderChrome(); if (route.view === "home") renderHome(); });
  on("project", d => { if (d.error || route.view !== "project" || d.key !== route.key) return; P = d; notify(); renderChrome(); projectChanged(); });
  on("run", d => {
    if (d.error || route.view !== "project") return;
    if (route.tab === "overview") { activeDetail = d; renderOverview(); }
    else if (d.id === route.run) { detail = d; renderDetail(); }
  });
  on("log", logEvent);
  on("job", jobEvent);
  ES.onopen = () => setConn(true);
  ES.onerror = () => {
    setConn(false);
    if (ES.readyState === 2) setTimeout(() => api("/api/projects").then(() => subscribe(true)).catch(() => setTimeout(() => subscribe(true), 5000)), 3000);
  };
}
function setConn(ok) { $("#upd").textContent = ok ? `● ${t("conn_live")}` : t("reconnecting"); $("#upd").classList.toggle("off", !ok); }
function projectChanged() {
  if (route.tab === "overview") { renderOverview(); subscribe(); }
  else if (route.tab === "runs") renderRunsTab();
  else if (route.tab === "run") renderRunPage();
  else if (route.tab === "results") renderResults();
}
async function render() {
  route = parseRoute();
  if (route.view === "project") {
    if (!P || P.key !== route.key) { try { P = await api(`/api/p/${route.key}`); } catch (e) { $("#content").innerHTML = `<div class="msg bad">${esc(e.message)}</div>`; return; } }
    const onRun = route.tab === "run";
    setTitle(onRun ? route.run : t(route.tab), `<a href="#/">${t("projects")}</a> / <a href="#/p/${P.key}/overview">${esc(P.name)}</a>${onRun ? ` / <a href="#/p/${P.key}/runs">${t("runs")}</a>` : ""}`);
    renderChrome();
    if (route.tab !== "runs") $("#content").innerHTML = "";
    ({overview: renderOverview, runs: renderRunsTab, run: renderRunPage, settings: renderSettings, data: renderData, results: renderResults})[route.tab]?.();
  } else {
    P = null; renderChrome();
    route.view === "system" ? renderSystem() : route.view === "new" ? renderWizard() : renderHome();
  }
  subscribe();
}
// After an action: fetch at once instead of waiting for the next event.
async function refresh() {
  try {
    await loadProjects();
    if (route.view === "project") { P = await api(`/api/p/${route.key}`); }
    notify(); renderChrome();
    if (route.view === "home") renderHome();
    if (route.view === "project" && route.tab === "overview") renderOverview();
    if (route.view === "project" && route.tab === "runs") renderRunsTab();
    if (route.view === "project" && route.tab === "run") renderRunPage();
  } catch (e) { setConn(false); }
}
try { if (window.Notification && Notification.permission === "default") document.addEventListener("click", () => Notification.requestPermission(), {once: true}); } catch {}
if (store("rb-side") === "mini") $("#app").classList.add("mini-side");
$("#collapse").onclick = () => { const on = $("#app").classList.toggle("mini-side"); store("rb-side", on ? "mini" : "full"); };
document.documentElement.lang = LANG;
Promise.all([loadProjects(), api("/api/me").then(m => { ME = m; })]).then(render).catch(() => { $("#upd").textContent = t("unreachable"); });
</script>
