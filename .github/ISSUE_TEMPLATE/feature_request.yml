name: An idea
description: Something runboard could do, or do better.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What you are trying to do
      description: The work you do and where runboard is in the way or missing. This matters more than a solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you imagine it, if you do. A screenshot or a sketch is welcome.
  - type: textarea
    id: now
    attributes:
      label: How you manage today
      description: A script, another tool, by hand.
