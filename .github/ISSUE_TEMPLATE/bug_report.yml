name: Something does not work
description: A run that does not start, a page that shows something wrong, an error, a crash.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for writing. A security problem goes through **Security → Report a vulnerability** instead (it stays
        private until it is fixed); see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you saw instead. The error text, if there was one.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to see it again
      description: The steps, as short as you can make them. A part of runboard.yaml or runs.yaml helps if it is about them.
      placeholder: |
        1. ...
        2. ...
  - type: dropdown
    id: backend
    attributes:
      label: Where the run was going
      options: ["Not about a run", "This computer (local)", "Kaggle", "SSH", "SLURM"]
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: The output of runboard doctor
      description: >-
        Run `runboard doctor` and paste what it prints. It holds the versions, the setup and the end of the dashboard's
        log; keys, your user folder and name, e-mail and network addresses are removed. Read it once before sending.
      render: markdown
    validations:
      required: true
