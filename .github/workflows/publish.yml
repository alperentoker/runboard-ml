name: publish

# A version tag (vX.Y.Z) builds runboard-ml, runs the tests (also against real machines) and publishes it to PyPI through trusted publishing:
# no token is stored anywhere. PyPI knows this repository and workflow as the project's publisher (see RELEASING.md).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: The tag is the version in pyproject.toml
        run: |
          v=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "${GITHUB_REF_NAME#v}" = "$v" || { echo "tag $GITHUB_REF_NAME, pyproject.toml $v"; exit 1; }
      - name: Test
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q
      - name: Build
        run: |
          python -m pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # The same real-machine tests as on every push (tests.yml): a release never goes out with SSH, SLURM or the Linux
  # autostart broken.
  real-machines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        env:
          RUNBOARD_TEST_DOCKER: "1"
        run: python -m pytest -q tests/test_docker_remote.py

  publish:
    needs: [build, real-machines]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/runboard-ml
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
