[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "runboard-ml"  # "runboard" on PyPI belongs to another project; the command and the module are still runboard
version = "0.2.0"
description = "Pre-registered ML experiments: lock the plan, run on your GPU, Kaggle, SSH or SLURM, watch live, and get hypotheses decided with bootstrap intervals and paper-ready output."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alperen Toker" }]
requires-python = ">=3.11"  # the Kaggle client (kaggle>=2.2) needs 3.11
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "pyyaml>=6"]
keywords = ["pre-registration", "reproducibility", "hypothesis testing", "bootstrap", "machine learning", "training",
            "dashboard", "kaggle", "slurm", "yolo"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.urls]
Homepage = "https://github.com/alperentoker/runboard-ml"
Documentation = "https://github.com/alperentoker/runboard-ml/blob/main/docs/manifest.md"
Issues = "https://github.com/alperentoker/runboard-ml/issues"
Security = "https://github.com/alperentoker/runboard-ml/security/policy"

[project.optional-dependencies]
kaggle = ["kaggle>=2.2", "six"]  # newer Kaggle clients import six without depending on it
dev = ["pytest", "httpx", "kaggle>=2.2", "six", "numpy"]  # numpy: the demo and the evaluation helpers

[project.scripts]
runboard = "runboard.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["runboard*"]

[tool.setuptools.package-data]
runboard = ["static/*", "static/js/*", "templates/*", "demo/*"]
