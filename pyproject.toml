[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "runboard"
version = "0.1.3"
description = "A self-hosted control panel for ML training runs: launch on Kaggle or a local GPU, watch them live, collect results — one dashboard for all your projects."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alperen Toker" }]
requires-python = ">=3.11"  # the Kaggle client (kaggle>=2.2) needs 3.11
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "pyyaml>=6"]
keywords = ["kaggle", "training", "dashboard", "mlops", "ultralytics", "yolo"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/alperentoker/runboard-ml"
Documentation = "https://github.com/alperentoker/runboard-ml/blob/main/docs/manifest.md"
Issues = "https://github.com/alperentoker/runboard-ml/issues"
Security = "https://github.com/alperentoker/runboard-ml/security/policy"

[project.optional-dependencies]
kaggle = ["kaggle>=2.2"]
dev = ["pytest", "httpx", "kaggle>=2.2"]

[project.scripts]
runboard = "runboard.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["runboard*"]

[tool.setuptools.package-data]
runboard = ["static/*", "static/js/*", "templates/*"]
